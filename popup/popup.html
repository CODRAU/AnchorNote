<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnchorNote</title>
    <link href="../styles/popup.css" rel="stylesheet" type="text/css">
    <script src="popup.js" defer></script>
</head>
<body>
    <div class="container">

    <!-- Header -->
    <div class="header">
        <div class="logo">
            <img src="../icons/icon128.png" style="width:60px; height:60px; object-fit:contain;">
        </div>
        <div class="brand">
        <span class="brand-name">AnchorNote</span>
        <span class="brand-tagline">Annotate the web</span>
        </div>
    </div>

    <!-- Tool Select -->
    <div class="section-label">Tool</div>
    <div class="tool-toggle">
        <button class="tool-btn " id="btn-highlighter" data-tool="highlighter">
            <span class="tool-icon">🖊</span>
            <span class="tool-name">Highlighter</span>
        </button>
        <button class="tool-btn" id="btn-marker" data-tool="marker">
            <span class="tool-icon">🖌</span>
            <span class="tool-name">Marker</span>
        </button>
        <button class="tool-btn" id="btn-eraser" data-tool="eraser">
            <span class="tool-icon">🧼</span>
            <span class="tool-name">Eraser</span>
        </button>
        
    </div>

    <!-- Color Palette w/ marker adjustment -->
    <div class="section-label">Color</div>
    <div class="color-palette">
        <!-- Color selectors -->
        <button class="color-btn color-yellow " data-color="#FFD700" title="Yellow"></button>
        <button class="color-btn color-green"  data-color="#4ade80" title="Green"></button>
        <button class="color-btn color-pink"   data-color="#f472b6" title="Pink"></button>
        <button class="color-btn color-blue"   data-color="#60a5fa" title="Blue"></button>
        <button class="color-btn color-orange" data-color="#fb923c" title="Orange"></button>
        <button class="color-btn color-custom" id="color-custom-btn" title="Custom">
            <input type="color" id="color-picker" value="#ffffff">
        </button>
    </div>
    <div class="section-label">Marker Options</div>
    <!-- Marker property selectors -->
    <div class="marker-options">
        <div class="marker-control">
            <input type="range" id="marker-size" min="4" max="40" value="16" class="size-slider">
            <span id="marker-size-label" class="marker-label">16px</span>
        </div>
        <div class="marker-control">
            <input type="text" id="marker-opacity" value="50" class="opacity-input" maxlength="3">
            <span class="marker-label">% Opacity</span>
        </div>
        <canvas id="marker-preview" width="50" height="50"></canvas>
    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="actions">
        <button class="action-btn" id="clearMarker" title="Clear all marker drawings">
        ✦ Clear Marker
        </button>
        <button class="action-btn danger" id="clearHighlights" title="Remove all highlights">
        ✕ Clear Highlights
        </button>
    </div>

    <!-- Status -->
    <div class="status-row">
        <div class="status-dot"></div>
        <span class="status-text" id="status-text">No tool active</span>
    </div>

    </div>
</body>
</html>
