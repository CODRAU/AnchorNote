<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnchorNote</title>
    <link href="../styles/popup.css" rel="stylesheet" type="text/css">
    <script src="popup.js" defer></script>
</head>
<body>
    <div class="container">

    <!-- Header -->
    <div class="header">
        <div class="logo">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
        </div>
        <div class="brand">
        <span class="brand-name">AnchorNote</span>
        <span class="brand-tagline">Annotate the web</span>
        </div>
    </div>

    <!-- Tool Select -->
    <div class="section-label">Tool</div>
    <div class="tool-toggle">
        <button class="tool-btn " id="btn-highlighter" data-tool="highlighter">
        <span class="tool-icon">🖊</span>
        <span class="tool-name">Highlighter</span>
        </button>
        <button class="tool-btn" id="btn-marker" data-tool="marker">
        <span class="tool-icon">🖌</span>
        <span class="tool-name">Marker</span>
        </button>
    </div>

    <!-- Color Palette -->
    <div class="section-label">Color</div>
    <div class="color-palette">
        <button class="color-btn color-yellow " data-color="#FFD700" title="Yellow"></button>
        <button class="color-btn color-green"  data-color="#4ade80" title="Green"></button>
        <button class="color-btn color-pink"   data-color="#f472b6" title="Pink"></button>
        <button class="color-btn color-blue"   data-color="#60a5fa" title="Blue"></button>
        <button class="color-btn color-orange" data-color="#fb923c" title="Orange"></button>
    </div>

    <div class="divider"></div>

    <!-- Actions -->
    <div class="actions">
        <button class="action-btn" id="clearMarker" title="Clear all marker drawings">
        ✦ Clear Marker
        </button>
        <button class="action-btn danger" id="clearHighlights" title="Remove all highlights">
        ✕ Clear Highlights
        </button>
    </div>

    <!-- Status -->
    <div class="status-row">
        <div class="status-dot"></div>
        <span class="status-text" id="status-text">No tool active</span>
    </div>

    </div>
</body>
</html>
